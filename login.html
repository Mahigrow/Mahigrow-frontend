<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MahiGrow — My Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --g:#0a7a30;--g2:#086826;--g3:#e8f5e9;--g4:#c8e6c9;
  --or:#e8620a;--ink:#212121;--ink2:#424242;--ink3:#9e9e9e;
  --border:#e0e0e0;--bg:#f5f5f5;--card:#fff;--red:#d32f2f;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.tb{max-width:900px;margin:0 auto;padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;}
.logo svg{width:26px;height:26px;}
.logo-name{font-size:.95rem;font-weight:800;color:var(--g);}
.logo-name em{color:var(--or);font-style:normal;}
.tb-right{margin-left:auto;display:flex;gap:8px;}
.btn-home{background:none;border:1px solid var(--border);color:var(--ink2);font-size:.76rem;font-weight:500;padding:6px 12px;border-radius:6px;}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:16px 14px 40px;}
.page-title{font-size:1.1rem;font-weight:800;margin-bottom:4px;}
.page-sub{font-size:.76rem;color:var(--ink3);margin-bottom:18px;}

/* STATUS FILTER */
.status-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;padding-bottom:2px;}
.status-tabs::-webkit-scrollbar{display:none;}
.stab{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.74rem;font-weight:600;color:var(--ink3);white-space:nowrap;}
.stab.on{background:var(--g);border-color:var(--g);color:#fff;}

/* ORDER CARD */
.order-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.order-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.order-id{font-size:.7rem;color:var(--ink3);}
.order-id strong{color:var(--ink);font-weight:600;}
.order-date{font-size:.7rem;color:var(--ink3);}

/* STATUS BADGE */
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;}
.status-badge::before{content:'';width:6px;height:6px;border-radius:50%;}
.s-PLACED{background:#E3F2FD;color:#1565C0;}
.s-PLACED::before{background:#1565C0;}
.s-PACKING{background:#FFF8E1;color:#E65100;}
.s-PACKING::before{background:#E65100;}
.s-OUT_FOR_DELIVERY{background:#E8F5E9;color:#1B5E20;}
.s-OUT_FOR_DELIVERY::before{background:#2E7D32;}
.s-DELIVERED{background:#E8F5E9;color:#1B5E20;}
.s-DELIVERED::before{background:var(--g);}
.s-CANCELLED{background:#FFEBEE;color:#B71C1C;}
.s-CANCELLED::before{background:var(--red);}

/* TRACKING TIMELINE */
.tracking{padding:16px;}
.track-steps{display:flex;justify-content:space-between;position:relative;margin-bottom:16px;}
.track-steps::before{content:'';position:absolute;top:16px;left:10%;right:10%;height:2px;background:var(--border);z-index:0;}
.track-line{position:absolute;top:16px;left:10%;height:2px;background:var(--g);z-index:1;transition:width .4s ease;}
.track-step{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;flex:1;}
.step-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .3s;}
.step-dot.done{background:var(--g);border-color:var(--g);}
.step-dot.active{background:#fff;border-color:var(--g);box-shadow:0 0 0 3px rgba(10,122,48,.15);}
.step-dot.done svg,.step-dot.active svg{display:none;}
.step-dot.done::after{content:'✓';color:#fff;font-weight:700;font-size:.8rem;}
.step-dot.active::after{content:'';width:10px;height:10px;background:var(--g);border-radius:50%;display:block;}
.step-lbl{font-size:.6rem;font-weight:600;color:var(--ink3);text-align:center;line-height:1.3;max-width:60px;}
.step-lbl.done,.step-lbl.active{color:var(--g);}

/* ORDER ITEMS */
.order-items{border-top:1px solid var(--border);padding:12px 16px;}
.order-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg);}
.order-item:last-child{border-bottom:none;}
.item-img{width:40px;height:40px;border-radius:6px;background:var(--bg);border:1px solid var(--border);object-fit:contain;padding:4px;flex-shrink:0;}
.item-name{font-size:.78rem;font-weight:600;color:var(--ink);flex:1;}
.item-meta{font-size:.68rem;color:var(--ink3);margin-top:2px;}
.item-total{font-size:.82rem;font-weight:700;color:var(--ink);text-align:right;flex-shrink:0;}

/* ORDER FOOTER */
.order-ft{padding:12px 16px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.order-total-row{font-size:.78rem;color:var(--ink2);}
.order-total-row strong{font-size:.92rem;font-weight:800;color:var(--ink);}
.order-ft-right{display:flex;gap:6px;}
.btn-reorder{background:var(--g3);border:1px solid var(--g4);color:var(--g2);font-size:.72rem;font-weight:600;padding:6px 12px;border-radius:6px;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state svg{width:60px;height:60px;opacity:.2;margin:0 auto 14px;display:block;}
.empty-state h2{font-size:1rem;font-weight:700;margin-bottom:6px;}
.empty-state p{font-size:.8rem;color:var(--ink3);margin-bottom:20px;}
.btn-shop{display:inline-block;background:var(--g);color:#fff;padding:11px 22px;border-radius:8px;font-weight:700;font-size:.84rem;text-decoration:none;}

/* LOADING */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="12" fill="#e8f5e9"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9" transform="rotate(60 13 13)"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9" transform="rotate(120 13 13)"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9" transform="rotate(180 13 13)"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9" transform="rotate(240 13 13)"/><ellipse cx="13" cy="6" rx="2.2" ry="5.5" fill="#0a7a30" opacity=".9" transform="rotate(300 13 13)"/><circle cx="13" cy="13" r="3.5" fill="#0a7a30"/><circle cx="13" cy="13" r="1.5" fill="#e8620a"/></svg>
      <span class="logo-name">Mahi<em>Grow</em></span>
    </a>
    <div class="tb-right">
      <button class="btn-home" onclick="window.location.href='index.html'">← Catalogue</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="page-title">My Orders</div>
  <div class="page-sub">Track your bulk orders</div>

  <!-- Status filter tabs -->
  <div class="status-tabs">
    <button class="stab on" onclick="filterStatus('ALL',this)">All Orders</button>
    <button class="stab" onclick="filterStatus('PLACED',this)">Order Placed</button>
    <button class="stab" onclick="filterStatus('PACKING',this)">Packing</button>
    <button class="stab" onclick="filterStatus('OUT_FOR_DELIVERY',this)">Out for Delivery</button>
    <button class="stab" onclick="filterStatus('DELIVERED',this)">Delivered</button>
    <button class="stab" onclick="filterStatus('CANCELLED',this)">Cancelled</button>
  </div>

  <div id="ordersWrap">
    <!-- Skeleton loading -->
    <div class="order-card">
      <div class="order-hd"><div class="skel" style="height:14px;width:200px;"></div><div class="skel" style="height:22px;width:100px;border-radius:20px;"></div></div>
      <div class="tracking"><div class="skel" style="height:60px;border-radius:8px;"></div></div>
      <div class="order-items"><div class="skel" style="height:50px;border-radius:6px;"></div></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
// ── STATUS CONFIG ──────────────────────────────
const STATUS_STEPS = [
  { key: 'PLACED',           label: 'Order\nPlaced',      icon: '📋' },
  { key: 'PACKING',          label: 'Packing',            icon: '📦' },
  { key: 'OUT_FOR_DELIVERY', label: 'Out for\nDelivery',  icon: '🚚' },
  { key: 'DELIVERED',        label: 'Delivered',          icon: '✅' },
];

const STATUS_LABEL = {
  PLACED:           'Order Placed',
  PACKING:          'Packing',
  OUT_FOR_DELIVERY: 'Out for Delivery',
  DELIVERED:        'Delivered',
  CANCELLED:        'Cancelled',
};

// ── STATE ──────────────────────────────────────
let allOrders    = [];
let activeFilter = 'ALL';

// ── INIT ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  if (!isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }
  await loadOrders();
});

async function loadOrders() {
  try {
    const data = await Orders.getAll();
    allOrders  = data.orders || [];
    renderOrders();
  } catch (err) {
    document.getElementById('ordersWrap').innerHTML =
      '<div class="empty-state"><p>Could not load orders. Please refresh.</p><a class="btn-shop" href="index.html">Browse Catalogue</a></div>';
  }
}

// ── FILTER ─────────────────────────────────────
function filterStatus(status, btn) {
  activeFilter = status;
  document.querySelectorAll('.stab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderOrders();
}

// ── RENDER ─────────────────────────────────────
function renderOrders() {
  const wrap = document.getElementById('ordersWrap');
  const list = activeFilter === 'ALL'
    ? allOrders
    : allOrders.filter(o => o.status === activeFilter);

  if (!list.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 60 60" fill="none"><rect x="10" y="15" width="40" height="38" rx="4" stroke="currentColor" stroke-width="2"/><path d="M20 15V12a10 10 0 0120 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="20" y1="30" x2="40" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="37" x2="35" y2="37" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <h2>${activeFilter === 'ALL' ? 'No orders yet' : 'No ' + STATUS_LABEL[activeFilter] + ' orders'}</h2>
        <p>${activeFilter === 'ALL' ? 'Place your first bulk order from the catalogue.' : 'No orders in this status.'}</p>
        <a class="btn-shop" href="index.html">Browse Catalogue →</a>
      </div>`;
    return;
  }

  wrap.innerHTML = list.map(o => buildOrderCard(o)).join('');
}

function buildOrderCard(o) {
  const stepIdx    = STATUS_STEPS.findIndex(s => s.key === o.status);
  const isCancelled = o.status === 'CANCELLED';
  const lineWidth  = isCancelled ? '0%' : stepIdx === -1 ? '0%' :
    ['0%', '33%', '66%', '100%'][stepIdx] || '0%';

  const stepsHtml = STATUS_STEPS.map((s, i) => {
    const done   = !isCancelled && i < stepIdx;
    const active = !isCancelled && i === stepIdx;
    const cls    = done ? 'done' : active ? 'active' : '';
    return `
      <div class="track-step">
        <div class="step-dot ${cls}">
          ${!done && !active ? `<span style="font-size:.85rem;">${s.icon}</span>` : ''}
        </div>
        <div class="step-lbl ${cls}">${s.label.replace('\n','<br/>')}</div>
      </div>`;
  }).join('');

  const itemsHtml = o.items.slice(0, 3).map(i => `
    <div class="order-item">
      ${i.product.imageUrl
        ? `<img class="item-img" src="${i.product.imageUrl}" alt="${i.product.name}"/>`
        : `<div class="item-img" style="display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📦</div>`
      }
      <div style="flex:1;">
        <div class="item-name">${i.product.name}</div>
        <div class="item-meta">${i.qty} ${i.product.unit}(s) × ₹${i.rate.toLocaleString('en-IN')}</div>
      </div>
      <div class="item-total">₹${i.total.toLocaleString('en-IN')}</div>
    </div>`).join('');

  const moreItems = o.items.length > 3
    ? `<div style="font-size:.7rem;color:var(--ink3);padding:6px 0;">+${o.items.length - 3} more item(s)</div>` : '';

  return `
    <div class="order-card">
      <div class="order-hd">
        <div>
          <div class="order-id">Order <strong>#${o.id.slice(-8).toUpperCase()}</strong></div>
          <div class="order-date">${new Date(o.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <span class="status-badge s-${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
      </div>

      ${!isCancelled ? `
      <div class="tracking">
        <div class="track-steps">
          <div class="track-line" style="width:calc(${lineWidth} - 0px);"></div>
          ${stepsHtml}
        </div>
      </div>` : `
      <div style="padding:12px 16px;font-size:.78rem;color:var(--red);background:#FFEBEE;">
        ✕ This order was cancelled.
      </div>`}

      <div class="order-items">
        ${itemsHtml}
        ${moreItems}
      </div>

      <div class="order-ft">
        <div class="order-total-row">
          ${o.items.length} item(s) · COD · GST incl.<br/>
          Total: <strong>₹${o.grandTotal.toLocaleString('en-IN')}</strong>
        </div>
        <div class="order-ft-right">
          <button class="btn-reorder" onclick="reorder('${o.id}')">Reorder</button>
        </div>
      </div>
    </div>`;
}

// ── REORDER ────────────────────────────────────
function reorder(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;
  // Add all items back to cart
  const cart = {};
  order.items.forEach(i => {
    cart[i.productId] = { p: i.product, qty: i.qty, rate: i.rate, total: i.total };
  });
  localStorage.setItem('mg_cart', JSON.stringify(cart));
  window.location.href = 'index.html';
}
</script>
</body>
</html>
